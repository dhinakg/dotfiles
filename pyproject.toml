# [project]
# name = "dotfiles"
# version = "0.1.0"
# description = "Add your description here"
# readme = "README.md"
# requires-python = ">=3.14"
# dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.5",

    # ty is still a bit jank
    # "ty>=0.0.76",

    # Unit testing and code coverage
    # "coverage>=7.16.0",
    # "pytest>=9.1.1",
    # "pytest-cov>=7.1.0",

    # Profiling
    # "pyinstrument>=5.1.3",
]


[tool.ruff]
# package = false
line-length = 140

[tool.ruff.lint]
preview = true
extend-select = [
    "E",
    "F",
    "W",
    "PTH",
    "TD",
    "RUF",
    "FURB",
    "Q",
    "PLE",
    "PLW",
    "PLR",
    "PLC",
    "SLF",
    "empty-docstring", # D419
]
ignore = [
    "missing-todo-author", # TD002
    "missing-todo-link",   # TD003
]
